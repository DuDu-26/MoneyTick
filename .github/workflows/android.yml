name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: ./gradlew :core:test --console=plain
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; release APK is signed with a temporary debug key."
          fi
      - name: Build APK
        env:
          MT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v5
        with:
          name: moneytick-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      # Releases are automatic: when versionName in app/build.gradle.kts is new, publish v<versionName>.
      - name: Check for new version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.MT_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            cp app/build/outputs/apk/release/app-release.apk "MoneyTick-v$v.apk"
          fi
      - name: Publish release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 摸鱼币 MoneyTick ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: MoneyTick-${{ steps.version.outputs.tag }}.apk
